{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - Sistema de Gestão</title>
    <style>
        /* Variáveis de cores mantendo a consistência do sistema */
        :root {
            --cor-fundo: #f4f4f9;
            --cor-texto-principal: #2d3748;
            --cor-texto-secundario: #4a5568;
            --cor-primaria: #0056b3;
            --cor-sucesso: #28a745;
            --cor-sucesso-hover: #218838;
            --cor-secundaria: #6c757d;
            --cor-secundaria-hover: #5a6268;
            --cor-foco: #ff9900;
            --cor-fundo-card: #ffffff;
            --cor-borda: #cbd5e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--cor-fundo); 
            color: var(--cor-texto-principal);
            padding: 40px 20px; 
        }

        .container { 
            width: 100%;
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--cor-fundo-card); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }

        h2 { 
            color: var(--cor-texto-principal); 
            border-bottom: 3px solid var(--cor-primaria); 
            padding-bottom: 12px; 
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        /* Formulários Acessíveis */
        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--cor-texto-secundario); 
            font-weight: 600; 
            font-size: 0.95rem;
        }

        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--cor-borda); 
            border-radius: 6px; 
            font-size: 1rem;
            color: var(--cor-texto-principal);
            transition: border-color 0.3s;
        }

        /* Foco para navegação por teclado */
        input:focus-visible {
            outline: none;
            border-color: var(--cor-foco);
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.2);
        }

        /* Botões Modernos */
        .botoes-acao {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button, .btn { 
            display: inline-block;
            text-align: center;
            border: 2px solid transparent; 
            padding: 12px 24px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 1rem; 
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-salvar { 
            background-color: var(--cor-sucesso); 
            color: white; 
        }
        
        .btn-salvar:hover { 
            background-color: var(--cor-sucesso-hover); 
            transform: translateY(-2px);
        }

        .btn-voltar { 
            background-color: var(--cor-secundaria); 
            color: white;
        }

        .btn-voltar:hover { 
            background-color: var(--cor-secundaria-hover); 
            transform: translateY(-2px);
        }

        /* Foco nos botões */
        button:focus-visible, .btn:focus-visible {
            outline: none;
            border-color: var(--cor-foco);
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.4);
        }

        /* Tabela Responsiva */
        .tabela-container {
            overflow-x: auto;
            margin-top: 25px;
            border-radius: 8px;
            border: 1px solid var(--cor-borda);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            background-color: white;
        }

        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid var(--cor-borda);
        }

        th { 
            background-color: var(--cor-primaria); 
            color: white; 
            font-weight: 600;
        }

        tr:last-child td { border-bottom: none; }
        
        tbody tr:hover { background-color: #f8fafc; }

    </style>
</head>
<body>
    <!-- HTML Semântico e Estruturado -->
    <main class="container">
        <h2>Cadastro de Produtos</h2>
        
        <!-- Formulário com aria-required -->
        <div class="form-group">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" placeholder="Ex: Cesto de Pão" required aria-required="true">
        </div>
        <div class="form-group">
            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" step="0.01" placeholder="Ex: 15.50" required aria-required="true">
        </div>
        <div class="form-group">
            <label for="estoque">Quantidade em Estoque:</label>
            <input type="number" id="estoque" placeholder="Ex: 50" required aria-required="true">
        </div>
        
        <div class="botoes-acao">
            <a href="/" class="btn btn-voltar" aria-label="Voltar para a página inicial">Voltar ao Menu</a>
            <button onclick="adicionarProduto()" class="btn-salvar" aria-label="Cadastrar novo produto no sistema">Cadastrar Produto</button>
        </div>

        <!-- Lista de Produtos Adicionados -->
        <h2 style="margin-top: 50px;">Produtos Cadastrados</h2>
        
        <div class="tabela-container" tabindex="0" aria-label="Tabela de produtos cadastrados">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Preço</th>
                        <th scope="col">Estoque</th>
                    </tr>
                </thead>
                <tbody id="lista-produtos">
                    <!-- Os produtos vão aparecer aqui via Django ou JS -->
                </tbody>
            </table>
        </div>
    </main>
