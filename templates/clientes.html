{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .voltar { background-color: #6c757d; margin-right: 10px; }
        .voltar:hover { background-color: #5a6268; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #0056b3; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cadastro de Clientes</h2>
        
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
            <label for="telefone">Telemóvel / WhatsApp:</label>
            <input type="tel" id="telefone" placeholder="Ex: (11) 99999-9999">
        </div>
        <div class="form-group">
            <label for="endereco">Endereço de Entrega:</label>
            <input type="text" id="endereco" placeholder="Ex: Rua das Flores, 123">
        </div>
        
        <div>
            <button class="voltar" onclick="window.location.href='/'">Voltar ao Menu</button>
            <button onclick="adicionarCliente()">Gravar Cliente</button>
        </div>

        <h2 style="margin-top: 40px;">Lista de Clientes</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                </tr>
            </thead>
            <tbody id="lista-clientes">
                <!-- Os clientes aparecerão aqui -->
            </tbody>
        </table>
    </div>

    <script src="{% static 'js/clientes.js' %}"></script>
</body>
</html>
